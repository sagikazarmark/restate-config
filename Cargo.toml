[package]
name = "restate-config"
version = "0.1.0"
description = "Configuration types and SDK option adapters for Restate endpoints"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sagikazarmark/restate-config"

[dependencies]
humantime-serde = "1.1.1"
restate-sdk = { version = "0.12.0", default-features = false, features = ["rust_crypto"] }
serde = { version = "1.0.219", features = ["derive"] }
thiserror = "2.0.16"

[dev-dependencies]
bytes = "1.10"
http = "1.3"
http-body-util = "0.1"
serde_json = "1.0.143"
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }

[package.metadata.release]
sign-commit = true
sign-tag = true
tag-message = "Release {{version}}"
tag-prefix = ""
